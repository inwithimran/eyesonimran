<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Eyes on Imran</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F8FAFC; }
        .tag-chip { display: inline-flex; align-items: center; gap: 6px; background: #EEF2FF; color: #6366F1; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
    </style>
</head>
<body class="min-h-screen text-slate-800">

    <div id="login-view" class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-sm bg-white rounded-3xl shadow-lg border border-slate-100 p-7 space-y-5">
            <div class="text-center space-y-1">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-500 to-indigo-700 mx-auto flex items-center justify-center text-white text-xl font-black">TI</div>
                <h1 class="text-lg font-extrabold text-slate-900">Admin Login</h1>
                <p class="text-xs text-slate-400">Eyes on Imran এর ছবি ম্যানেজ করুন</p>
            </div>
            <div class="space-y-3">
                <input id="login-email" type="email" placeholder="Email" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-indigo-400">
                <input id="login-password" type="password" placeholder="Password" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-indigo-400">
                <button id="login-btn" class="w-full py-3 rounded-xl bg-indigo-600 text-white text-sm font-bold active:scale-95 transition">Login</button>
                <p id="login-error" class="text-xs text-red-500 text-center hidden"></p>
                <p id="firebase-warning" class="text-xs text-amber-600 text-center hidden">firebase-config.js এ আপনার Firebase কনফিগারেশন বসান।</p>
            </div>
        </div>
    </div>

    <div id="dashboard-view" class="hidden max-w-3xl mx-auto p-4 pb-16 space-y-6">
        <div class="flex items-center justify-between pt-4">
            <h1 class="text-lg font-extrabold text-slate-900">Admin Panel</h1>
            <div class="flex items-center gap-2">
                <button id="logout-btn" class="text-xs font-bold text-red-500 px-3 py-2 rounded-lg hover:bg-red-50">Logout</button>
            </div>
        </div>

        <div class="bg-white rounded-3xl shadow-sm border border-slate-100 p-6 space-y-4">
            <h2 class="text-sm font-extrabold text-slate-900 flex items-center gap-2"><i class="fa-solid fa-cloud-arrow-up text-indigo-500"></i> নতুন ছবি আপলোড করুন</h2>

            <div id="dropzone" class="border-2 border-dashed border-slate-200 rounded-xl p-6 text-center cursor-pointer hover:border-indigo-400 hover:bg-indigo-50/40 transition-colors">
                <i class="fa-solid fa-cloud-arrow-up text-2xl text-indigo-400 mb-2"></i>
                <p class="text-xs font-bold text-slate-500">ছবি এখানে ড্র্যাগ করে ছাড়ুন, অথবা ক্লিক করে বেছে নিন</p>
                <p class="text-[10px] text-slate-400 mt-1">একসাথে একাধিক ছবি বাছাই করা যাবে</p>
            </div>
            <input id="file-input" type="file" accept="image/*" multiple class="hidden">

            <div id="upload-queue" class="hidden grid grid-cols-3 sm:grid-cols-4 gap-2"></div>

            <textarea id="caption-input" rows="2" placeholder="ক্যাপশন লিখুন... (একাধিক ছবি হলে সবগুলোতে একই ক্যাপশন বসবে)" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-indigo-400"></textarea>

            <input id="categories-input" type="text" placeholder="ক্যাটাগরি, কমা দিয়ে আলাদা করুন (dhaka, eid-special)" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-indigo-400">

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-wide">Camera (EXIF)</label>
                    <input id="camera-input" type="text" placeholder="স্বয়ংক্রিয়ভাবে বসবে" class="w-full mt-1 px-3 py-2.5 rounded-lg border border-slate-200 text-xs focus:outline-none focus:border-indigo-400">
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-wide">তোলার তারিখ (EXIF)</label>
                    <input id="date-input" type="text" placeholder="স্বয়ংক্রিয়ভাবে বসবে" class="w-full mt-1 px-3 py-2.5 rounded-lg border border-slate-200 text-xs focus:outline-none focus:border-indigo-400">
                </div>
            </div>

            <button id="upload-btn" class="w-full py-3 rounded-xl bg-indigo-600 text-white text-sm font-bold active:scale-95 transition flex items-center justify-center gap-2">
                <span id="upload-btn-text">আপলোড করুন</span>
                <i id="upload-spinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
            </button>
        </div>

        <div class="bg-white rounded-3xl shadow-sm border border-slate-100 p-6 space-y-4">
            <h2 class="text-sm font-extrabold text-slate-900 flex items-center gap-2"><i class="fa-solid fa-images text-indigo-500"></i> অ্যাডমিন-আপলোডকৃত ছবি</h2>
            <div id="cloud-photo-list" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
            <p id="cloud-empty" class="text-xs text-slate-400 text-center py-6">এখনো কোনো ছবি আপলোড হয়নি।</p>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-5 py-3 rounded-full text-xs font-semibold opacity-0 pointer-events-none transition-all duration-300 shadow-lg"></div>

    <div id="edit-modal" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
        <div class="w-full max-w-sm bg-white rounded-3xl shadow-xl p-6 space-y-4">
            <h3 class="text-sm font-extrabold text-slate-900">ছবি এডিট করুন</h3>
            <img id="edit-preview" class="w-full h-40 object-cover rounded-xl border border-slate-100">
            <textarea id="edit-caption" rows="2" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-indigo-400"></textarea>
            <input id="edit-categories" type="text" placeholder="ক্যাটাগরি, কমা দিয়ে আলাদা করুন" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-indigo-400">
            <div class="flex gap-2">
                <button id="edit-cancel-btn" class="flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-600 text-sm font-bold">বাতিল</button>
                <button id="edit-save-btn" class="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-bold">সেভ করুন</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="cloudinary-config.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.js"></script>
    <script src="admin.js"></script>
</body>
</html>
